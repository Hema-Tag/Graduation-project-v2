<!DOCTYPE html>
<html lang="ar" dir="ltr">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Infinity Slider</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Playfair+Display:ital,wght@0,700;1,400&display=swap"
    rel="stylesheet" />
  <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="Css/slider.css" />
</head>

<body>

  <!-- زر العودة الطائر (Floating Back Button) -->
  <a href="../index.html" class="floating-back-btn" title="العودة للصفحة الرئيسية">
    <i class="bx bx-left-arrow-alt"></i>
    <span>العودة للرئيسية</span>
  </a>

  <div class="hologram-section">
    <h2 class="hologram-title">المخطط المساحي ثلاثي الأبعاد (هولوجرام)</h2>
    <div class="hologram-controls">
      <button onclick="switchHologramModel('./models/2.gltf')" class="holo-btn active" id="btn-model1">المجسم
        الأول</button>
      <button onclick="switchHologramModel('./models/sence.gltf')" class="holo-btn" id="btn-model2">المجسم
        الثاني</button>
    </div>
    <div id="hologram-container"></div>
  </div>

  <footer class="site-footer">
    <div class="footer-inner">

      <!-- العمود الأول: اسم المشروع -->
      <div class="footer-col footer-brand">
        <a href="../index.html" class="footer-logo">
          Graduation Project<br><span>(Group 5)</span>
        </a>
      </div>

      <!-- العمود الثاني: Quick Links -->
      <div class="footer-col">
        <p class="footer-col-title">Quick Links</p>
        <div class="footer-nav">
          <a href="../index.html" class="footer-nav-link">Home</a>
        </div>
      </div>

      <!-- العمود الثالث: Contact Me -->
      <div class="footer-col">
        <p class="footer-col-title">Contact Me</p>
        <p class="footer-phone">+20 1069415186</p>
      </div>

      <!-- العمود الرابع: Follow Me -->
      <div class="footer-col">
        <p class="footer-col-title">Follow Me</p>
        <div class="footer-socials">
          <a href="#" target="_blank" class="footer-soc fb">
            <i class="bx bxl-facebook-circle"></i>
          </a>
          <a href="#" target="_blank" class="footer-soc insta">
            <i class="bx bxl-instagram"></i>
          </a>
        </div>
      </div>

    </div>

    <div class="footer-bottom">
      <span> Graduation Project (Group 5) , All rights reserved © 2026 .</span>
    </div>
  </footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3/camera_utils.js"
    crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4/hands.js" crossorigin="anonymous"></script>

  <video id="webcam" autoplay playsinline style="display:none; width: 1px; height: 1px;"></video>
  <script src="slider.js"></script>

</body>

</html>
